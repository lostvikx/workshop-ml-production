<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IMDB Sentiment</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231a1d23'/><rect x='4' y='7' width='8' height='2' fill='%23e4e7ec'/></svg>"
    />
    <style>
      :root {
        --ground: #e4e7ec;
        --ink: #1a1d23;
        --positive: #c2703a;
        --negative: #3f5e8c;
        --rule: #c3c9d2;
        --muted: #5c6472;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 3rem 1.25rem 5rem;
        background: var(--ground);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 0.35rem;
      }

      .lede {
        margin: 0 0 2.25rem;
        color: var(--muted);
        max-width: 44ch;
      }

      .samples {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: baseline;
        margin-bottom: 0.85rem;
      }

      .samples-label {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .samples button {
        font: inherit;
        font-size: 0.85rem;
        background: none;
        border: 1px solid var(--rule);
        border-radius: 2px;
        color: var(--ink);
        padding: 0.2rem 0.6rem;
        cursor: pointer;
      }

      .samples button:hover {
        border-color: var(--muted);
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 7.5rem;
        padding: 0.85rem 1rem;
        background: #f2f4f7;
        border: 1px solid var(--rule);
        border-radius: 2px;
        color: var(--ink);
        font: inherit;
        resize: vertical;
      }

      textarea::placeholder {
        color: #9aa2b0;
      }

      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .actions {
        margin-top: 0.85rem;
      }

      #submit {
        font: inherit;
        font-weight: 600;
        background: var(--ink);
        color: #f2f4f7;
        border: 0;
        border-radius: 2px;
        padding: 0.6rem 1.4rem;
        cursor: pointer;
      }

      #submit[disabled] {
        background: var(--muted);
        cursor: progress;
      }

      #error {
        margin: 0.85rem 0 0;
        color: #8a3a2c;
        font-size: 0.9rem;
      }

      #error:empty {
        display: none;
      }

      .verdict {
        margin-top: 2.75rem;
        border-top: 1px solid var(--rule);
        padding-top: 1.5rem;
      }

      .verdict[hidden],
      #recent[hidden] {
        display: none;
      }

      .verdict-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .verdict-label[data-label="Positive"] {
        color: var(--positive);
      }

      .verdict-label[data-label="Negative"] {
        color: var(--negative);
      }

      .confidence {
        font-size: 1.05rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .bar {
        margin-top: 0.9rem;
        height: 6px;
        background: #cfd5de;
        border-radius: 3px;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        width: 0;
        transition: width 320ms ease-out;
      }

      .bar[data-label="Positive"] span {
        background: var(--positive);
      }

      .bar[data-label="Negative"] span {
        background: var(--negative);
      }

      #recent {
        margin-top: 3rem;
      }

      #recent h2 {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }

      #recent ol {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--rule);
      }

      #recent li {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding: 0.6rem 0;
        border-bottom: 1px solid var(--rule);
        font-size: 0.92rem;
      }

      #recent .snippet {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #recent .tag {
        flex: none;
        font-variant-numeric: tabular-nums;
        font-size: 0.85rem;
      }

      #recent .tag[data-label="Positive"] {
        color: var(--positive);
      }

      #recent .tag[data-label="Negative"] {
        color: var(--negative);
      }

      @media (prefers-reduced-motion: reduce) {
        .bar span {
          transition: none;
        }
      }

      @media (max-width: 30rem) {
        body {
          padding-top: 2rem;
        }

        .verdict-label {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IMDB Sentiment</h1>
      <p class="lede">
        Paste a movie review. The classifier reads it and returns a verdict with
        its confidence.
      </p>

      <div class="samples">
        <span class="samples-label" id="samples-label">Try an example:</span>
        <button type="button" data-sample="The Intern is a sweet, heartwarming comedy about an aging widower who takes an internship at a fashion startup.">
          A good film
        </button>
        <button type="button" data-sample="Digging for Fire follows a married couple who find a bone and a gun while house-sitting, triggering a disjointed weekend of separate misadventures.">
          A bad film
        </button>
      </div>

      <form id="form" novalidate>
        <label for="review" hidden>Movie review</label>
        <textarea
          id="review"
          name="review"
          placeholder="Type or paste a review…"
          aria-describedby="samples-label"
        ></textarea>
        <div class="actions">
          <button id="submit" type="submit">Read the review</button>
        </div>
        <p id="error" role="alert"></p>
      </form>

      <section id="verdict" class="verdict" hidden aria-live="polite">
        <div class="verdict-label">
          <span id="verdict-word"></span>
          <span class="confidence" id="verdict-confidence"></span>
        </div>
        <div class="bar" id="verdict-bar"><span></span></div>
      </section>

      <section id="recent" hidden>
        <h2>Recent</h2>
        <ol id="recent-list"></ol>
      </section>
    </main>

    <script>
      const form = document.getElementById("form");
      const textarea = document.getElementById("review");
      const submit = document.getElementById("submit");
      const error = document.getElementById("error");
      const verdict = document.getElementById("verdict");
      const verdictWord = document.getElementById("verdict-word");
      const verdictConfidence = document.getElementById("verdict-confidence");
      const verdictBar = document.getElementById("verdict-bar");
      const recent = document.getElementById("recent");
      const recentList = document.getElementById("recent-list");

      const RECENT_LIMIT = 5;
      let history = [];

      for (const button of document.querySelectorAll("[data-sample]")) {
        button.addEventListener("click", () => {
          textarea.value = button.dataset.sample;
          textarea.focus();
          error.textContent = "";
        });
      }

      function showError(message) {
        error.textContent = message;
      }

      function renderVerdict({ label, confidence }) {
        const percent = (confidence * 100).toFixed(1);

        verdictWord.textContent = label;
        verdictWord.parentElement.dataset.label = label;
        verdictConfidence.textContent = `${percent}%`;
        verdictBar.dataset.label = label;
        verdictBar.firstElementChild.style.width = `${percent}%`;
        verdict.hidden = false;
      }

      function renderHistory() {
        recentList.replaceChildren();
        for (const item of history) {
          const row = document.createElement("li");

          const snippet = document.createElement("span");
          snippet.className = "snippet";
          snippet.textContent = item.review;

          const tag = document.createElement("span");
          tag.className = "tag";
          tag.dataset.label = item.label;
          tag.textContent = `${item.label} ${(item.confidence * 100).toFixed(1)}%`;

          row.append(snippet, tag);
          recentList.append(row);
        }
        recent.hidden = history.length === 0;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";

        const review = textarea.value.trim();
        if (!review) {
          showError("Write a review first.");
          textarea.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Reading…";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ review }),
          });

          if (!response.ok) {
            if (response.status === 422) {
              showError("Write a review first.");
            } else if (response.status === 503) {
              showError(
                "No model loaded. Run uv run model/train.py to train it."
              );
            } else {
              showError(
                `The service returned an error (${response.status}). Try again.`
              );
            }
            return;
          }

          const result = await response.json();
          renderVerdict(result);
          history = [{ review, ...result }, ...history].slice(0, RECENT_LIMIT);
          renderHistory();
          textarea.value = "";
        } catch {
          showError(
            "Couldn't reach the service. Check that it is running, then try again."
          );
        } finally {
          submit.disabled = false;
          submit.textContent = "Read the review";
        }
      });
    </script>
  </body>
</html>
