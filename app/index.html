<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>IMDb Movie Review - Sentiment Prediction</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231a1d23'/><rect x='4' y='7' width='8' height='2' fill='%23e4e7ec'/></svg>"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main>
            <h1>Imdb Movie Review - Sentiment Prediction</h1>
            <p class="lede">
                Paste a movie review. The classifier reads it and returns a
                verdict with its confidence.
            </p>

            <div class="samples">
                <span class="samples-label" id="samples-label"
                    >Try an example:</span
                >
                <button
                    type="button"
                    data-sample="The Intern is a sweet, heartwarming comedy about an aging widower who takes an internship at a fashion startup."
                >
                    A good film
                </button>
                <button
                    type="button"
                    data-sample="Digging for Fire follows a married couple who find a bone and a gun while house-sitting, triggering a disjointed weekend of separate misadventures."
                >
                    A bad film
                </button>
            </div>

            <form id="form" novalidate>
                <label for="review" hidden>Movie review</label>
                <textarea
                    id="review"
                    name="review"
                    placeholder="Type or paste a review…"
                    aria-describedby="samples-label"
                ></textarea>
                <div class="actions">
                    <button id="submit" type="submit">Read the review</button>
                </div>
                <p id="error" role="alert"></p>
            </form>

            <section id="verdict" class="verdict" hidden aria-live="polite">
                <div class="verdict-label">
                    <span id="verdict-word"></span>
                    <span class="confidence" id="verdict-confidence"></span>
                </div>
                <div class="bar" id="verdict-bar"><span></span></div>
            </section>

            <section id="recent" hidden>
                <h2>Recent</h2>
                <ol id="recent-list"></ol>
            </section>
        </main>

        <script src="app.js" defer></script>
    </body>
</html>
